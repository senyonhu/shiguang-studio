<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>失落的星图</title><style>
*{box-sizing:border-box}body{margin:0;background:#081a25;color:#d3dfd3;font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;overflow-x:hidden}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #e8ce8c;outline-offset:4px}.world{min-height:100vh;position:relative;display:flex;flex-direction:column;align-items:center;padding:28px 24px 22px;background:radial-gradient(ellipse at 50% 43%,#1c3b44 0,#0a1e2b 50%,#071722 100%);overflow:hidden}.sky{position:absolute;inset:0;pointer-events:none;opacity:.7}.sky i{position:absolute;background:#ccd7b4;border-radius:50%;box-shadow:0 0 8px #b8d5c466}.eyebrow{position:relative;font-size:8px;letter-spacing:4px;color:#809994;margin:0 0 9px}h1{font-family:Georgia,"SimSun",serif;font-size:25px;letter-spacing:5px;font-weight:400;color:#e1dcb5;position:relative;margin:0 0 10px}.intro{font-size:11px;color:#8da8a5;letter-spacing:1px;margin:0;position:relative;text-align:center;line-height:1.8}.puzzle{position:relative;width:min(330px,74vw);height:min(330px,74vw);margin:18px 0 4px;flex-shrink:0}.puzzle svg{width:100%;height:100%;overflow:visible}.target-label{position:absolute;top:1%;left:50%;transform:translate(-50%,-50%);font-size:8px;letter-spacing:2px;color:#ddc994;background:#17313c;padding:4px 9px;border:1px solid #a8b69144;border-radius:3px;white-space:nowrap}.ring{transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-origin:200px 200px}.ring path{transition:stroke .6s}.line{stroke:#759490;stroke-width:.5;opacity:.35}.starmark{fill:#c7d5b2}.pointer{fill:#d7c284;filter:drop-shadow(0 0 4px #bdb472)}.center{font-size:38px;fill:#dace9b;filter:drop-shadow(0 0 8px #cece8766);transition:all .7s}.lit .center{fill:#fff3b2;filter:drop-shadow(0 0 18px #faeaa5)}.constellation{stroke:#a6ccad;stroke-width:1;fill:none;opacity:.18;transition:opacity 1s}.lit .constellation{opacity:.9}.status{height:22px;font-size:10px;letter-spacing:1px;color:#8cab9d;margin:5px 0 12px}.status b{color:#e3d69f;font-weight:400}.controls{display:flex;gap:12px;position:relative;justify-content:center;width:100%;max-width:470px}.dial{flex:1;border:1px solid #66887866;border-radius:6px;background:linear-gradient(#23413e88,#112e32aa);color:#c9d5b7;padding:11px 8px;transition:all .2s;min-width:0}.dial:hover{background:#36544b;border-color:#a3b490}.dial:disabled{cursor:default;opacity:.6}.dial b{font-size:11px;font-weight:400;display:block;letter-spacing:1px}.dial small{display:block;font-size:8px;margin-top:6px;color:#7f9e91;letter-spacing:1px}.dial.aligned{border-color:#9bbd8955;background:#28473e88}.dial.aligned small{color:#aec88f}.dial .rotate{display:inline-block;font-size:15px;margin-right:5px}.bottom{position:relative;display:flex;align-items:center;gap:24px;justify-content:center;margin-top:19px}.subtle{border:0;background:none;color:#819f94;font-size:10px;padding:4px}.subtle:hover{color:#dae3c1}.hint{min-height:22px;margin:12px 0 0;font-size:10px;color:#b3bea1;text-align:center;line-height:1.8;position:relative}.win{display:none;position:absolute;inset:0;z-index:3;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:#071b24e8;backdrop-filter:blur(5px);padding:25px}.win.visible{display:flex;animation:appear .8s}.win .sigil{font-size:66px;color:#e5d899;text-shadow:0 0 40px #e9d78e88}.win>span:not(.sigil){font-size:9px;letter-spacing:5px;color:#a0b59e;margin-top:19px}.win h2{font-family:"SimSun",serif;font-size:28px;font-weight:400;letter-spacing:4px;color:#e5e4c3;margin:17px 0}.win p{font-size:12px;color:#a6bfb1;line-height:2;margin:0 0 27px}.win button{border:1px solid #afb98a99;color:#e4e8c8;padding:13px 31px;background:#325848;border-radius:4px;font-size:12px;letter-spacing:2px}.win button:hover{background:#527556}.win small{margin-top:18px;font-size:9px;color:#729182}.connection{font-size:9px;color:#8c7862;position:relative;min-height:12px;margin-top:9px}.connection.ready{color:#739281}.light-ray{position:absolute;top:22%;left:50%;width:1px;height:180px;background:linear-gradient(#dbc98999,transparent);pointer-events:none;opacity:.4}.puzzle.lit .light-ray{box-shadow:0 0 25px 4px #d8dca84d;opacity:1}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-height:610px){.world{padding-top:18px}.puzzle{width:270px;height:270px;margin:14px 0 0}.bottom{margin-top:12px}.hint{margin-top:7px}.status{margin:2px 0 10px}.controls{max-width:400px}.dial{padding:9px 6px}}@media(max-width:440px){.world{padding:25px 18px}.puzzle{width:280px;height:280px;margin-top:27px}h1{font-size:23px}.intro{font-size:10px}.controls{gap:8px}.dial b{font-size:10px}.dial small{font-size:7px}.bottom{margin-top:22px}.hint{max-width:280px}.win h2{font-size:23px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="world"><div class="sky" id="sky"></div><p class="eyebrow">THE FORGOTTEN CONSTELLATION</p><h1>让星光，找到归途。</h1><p class="intro">转动三道星环，让金色指针一同朝向顶端的引路星。</p><div class="puzzle" id="puzzle"><div class="target-label">✦ 引路星</div><div class="light-ray"></div><svg viewBox="0 0 400 400" aria-label="三道可转动的星环"><defs><radialGradient id="glow"><stop stop-color="#b8c88b" stop-opacity=".13"/><stop offset="1" stop-color="#b8c88b" stop-opacity="0"/></radialGradient></defs><circle cx="200" cy="200" r="170" fill="url(#glow)"/><path class="line" d="M200 28V372M28 200H372M78 78L322 322M78 322L322 78"/><circle cx="200" cy="200" r="178" fill="none" stroke="#6c8a83" stroke-width=".5" stroke-dasharray="1 10"/><path class="constellation" d="M200 49L329 249L80 273L200 91L294 246L118 247L200 132L250 230L152 230Z"/><g id="ring0" class="ring"></g><g id="ring1" class="ring"></g><g id="ring2" class="ring"></g><circle cx="200" cy="200" r="33" fill="#122e34" stroke="#adc295" stroke-width=".6"/><text class="center" x="200" y="213" text-anchor="middle">✧</text></svg></div><div class="status" id="status" role="status"></div><div class="controls"><button class="dial" id="dial0" aria-label="转动外环"><b><span class="rotate">↻</span>转动外环</b><small id="angle0"></small></button><button class="dial" id="dial1" aria-label="转动中环"><b><span class="rotate">↻</span>转动中环</b><small id="angle1"></small></button><button class="dial" id="dial2" aria-label="转动内环"><b><span class="rotate">↻</span>转动内环</b><small id="angle2"></small></button></div><div class="bottom"><button class="subtle" id="hintButton">✧ 给我一点提示</button><button class="subtle" id="resetButton">↺ 重新调整</button></div><p class="hint" id="hint">没有时间限制。慢慢来，星光会等你。</p><div class="connection" id="connection">正在等待剧情引擎…</div><section class="win" id="win" role="status"><span class="sigil">✧</span><span>CONSTELLATION RESTORED</span><h2>星图，再次亮起。</h2><p>一道微光越过海面，回应了旧塔的等待。<br/>有人正在循着它，找到回家的路。</p><button id="complete">带着星光，回到故事 →</button><small>关卡结果将交还给剧情引擎</small></section></main><script>
let steps=[2,5,3], token='', done=false, connected=false, showHint=false;
const $=id=>document.getElementById(id); const names=['外环','中环','内环'];
function send(type,extra={}){if(connected)parent.postMessage({type,token,...extra},'*');}
function valid(v){return Array.isArray(v)&&v.length===3&&v.every(n=>Number.isInteger(n)&&n>=0&&n<8);}
for(let i=0;i<37;i++){const dot=document.createElement('i');const size=i%5===0?2:1;dot.style.cssText=`left:${(i*37+11)%100}%;top:${(i*23+7)%100}%;width:${size}px;height:${size}px;opacity:${.2+(i%6)/10}`;$('sky').append(dot);}
for(let i=0;i<3;i++){const r=[151,109,68][i];let marks='';for(let j=0;j<8;j++){const a=j*Math.PI/4;marks+=`<circle cx="${200+Math.sin(a)*r}" cy="${200-Math.cos(a)*r}" r="${j%2?1.5:2.5}" fill="#98b7a1"/>`;}
const x1=200+r*Math.cos(-80*Math.PI/180),y1=200+r*Math.sin(-80*Math.PI/180),x2=200+r*Math.cos(-100*Math.PI/180),y2=200+r*Math.sin(-100*Math.PI/180);
$('ring'+i).innerHTML=`<circle cx="200" cy="200" r="${r-7}" fill="none" stroke="#76968d" stroke-width=".45" opacity=".45"/><path d="M${x1} ${y1} A${r} ${r} 0 1 1 ${x2} ${y2}" fill="none" stroke="#99b29a" stroke-width="2"/>${marks}<path class="pointer" d="M200 ${200-r-10} L205 ${200-r+2} L200 ${200-r+7} L195 ${200-r+2} Z"/>`;
$('dial'+i).addEventListener('click',()=>{if(!connected||done)return;steps[i]=(steps[i]+1)%8;render();send('level:checkpoint',{steps:[...steps]});});}
function render(){let aligned=steps.filter(n=>n===0).length;for(let i=0;i<3;i++){$('ring'+i).style.transform=`rotate(${steps[i]*45}deg)`;$('dial'+i).classList.toggle('aligned',steps[i]===0);$('angle'+i).textContent=steps[i]===0?'✦ 已对齐':`${steps[i]*45}° · 每次转动 45°`;$('dial'+i).disabled=!connected;}$('status').innerHTML=`<b>${aligned} / 3</b> 道星环已对齐`;$('puzzle').classList.toggle('lit',aligned===3);$('win').classList.toggle('visible',aligned===3);if(showHint)$('hint').textContent=steps.map((s,i)=>`${names[i]}${s===0?'已对齐':`再转 ${8-s} 次`}`).join(' · ');}
$('hintButton').onclick=()=>{showHint=true;render();};$('resetButton').onclick=()=>{if(!connected)return;steps=[2,5,3];done=false;render();send('level:checkpoint',{steps:[...steps]});};$('complete').onclick=()=>{if(done||!connected||!steps.every(n=>n===0))return;done=true;send('level:complete',{steps:[...steps],outcome:'passed'});};
window.addEventListener('message',e=>{if(e.source!==parent||!e.data||e.data.type!=='studio:init'||typeof e.data.token!=='string'||e.data.token.length>100||!valid(e.data.steps))return;if(connected&&token===e.data.token){send('level:ready');return;}token=e.data.token;steps=[...e.data.steps];connected=true;done=false;$('connection').textContent='✦ 星图已准备就绪';$('connection').classList.add('ready');send('level:ready');render();});render();
</script></body></html>
