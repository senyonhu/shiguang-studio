[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "renpy-codex-bridge"
version = "0.1.3"
description = "Local structured Ren'Py authoring tools for Codex"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.26,<2",
  "pydantic>=2.12,<3",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
  "python-docx>=1.2,<2",
  "filelock>=3.20,<4",
  "psutil>=7,<8",
  "fonttools>=4.60,<5",
  "mutagen==1.47.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "PyYAML>=6,<7"]
audio = ["soundcard>=0.4,<1", "numpy>=2,<3"]

[project.scripts]
renpy-bridge = "renpy_bridge.cli:main"
renpy-bridge-mcp = "renpy_bridge.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
